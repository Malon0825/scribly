name: Build and browser checks

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/webpage.html
      - assets/screenshots/**
      - docs/images/**
      - scripts/build-pages.mjs
      - .github/workflows/pages.yml
      - tests/verification.md
  pull_request:
    paths-ignore:
      - assets/webpage.html
      - assets/screenshots/**
      - docs/images/**
      - scripts/build-pages.mjs
      - .github/workflows/pages.yml
      - tests/verification.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Production icon, saving, and recovery regressions
        run: npx playwright test tests/starter-notebook.spec.ts tests/app-icon.spec.ts tests/finalization.spec.ts tests/recovery.spec.ts --workers=2 --timeout=120000
        env:
          PLAYWRIGHT_PREVIEW: '1'

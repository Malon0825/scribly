[package]
name = "scribly"
version = "1.3.18"
description = "A calm, local-first notebook"
authors = ["Scribly"]
edition = "2021"

[lib]
name = "still_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
auto-launch = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
uuid = { version = "1", features = ["v4"] }
dunce = "1"
sha2 = "0.10"
crc32fast = "1"
regex = "1"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1


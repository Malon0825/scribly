<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribly · light and dark identity</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #dde5ef; font: 14px "Segoe UI", sans-serif; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; max-width: 960px; margin: auto; }
  article { --accent: #0879ff; --line: #d8e2f0; padding: 32px; border: 1px solid var(--line); border-radius: 25px; background: #f0f5fb; color: #3f506e; }
  article.dark { --accent: #e6c495; --line: #494944; background: #272726; color: #e0ddd6; }
  h1 { margin: 0 0 28px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .identity { display: flex; gap: 20px; align-items: center; margin-bottom: 34px; }
  .identity img { width: 80px; height: 80px; }
  .word { display: block; width: 152px; height: 60px; background: var(--accent); mask: url('/scribly-wordmark.webp') center / contain no-repeat; -webkit-mask: url('/scribly-wordmark.webp') center / contain no-repeat; }
  .header { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 25px; padding: 18px; margin-bottom: 28px; }
  .header .word { width: 76px; height: 28px; }
  .divider { height: 22px; width: 1px; background: var(--line); }
  .sizes { display: flex; gap: 24px; align-items: end; min-height: 50px; }
  .sizes figure { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; }
  figcaption { font-size: 11px; opacity: .7; }
  p { font-size: 12px; line-height: 1.6; margin: 26px 0 0; opacity: .75; }
  @media(max-width: 700px) { main { grid-template-columns: 1fr; } }
</style>
<main>
  <article>
    <h1>Light · blue ink</h1>
    <div class="identity"><img src="/scribly-icon.webp" alt="Scribly S icon"><span class="word" role="img" aria-label="Scribly"></span></div>
    <div class="header"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="1"/><path d="M9 4v16"/></svg><span class="divider"></span><span class="word" role="img" aria-label="Scribly at actual header size"></span></div>
    <div class="sizes"><figure><img src="/scribly-icon.png" width="16" height="16" alt="16 pixel S icon"><figcaption>16px</figcaption></figure><figure><img src="/scribly-icon.png" width="20" height="20" alt="20 pixel S icon"><figcaption>20px</figcaption></figure><figure><img src="/scribly-icon.png" width="32" height="32" alt="32 pixel S icon"><figcaption>32px</figcaption></figure><figure><img src="/scribly-icon.png" width="48" height="48" alt="48 pixel S icon"><figcaption>48px</figcaption></figure></div>
    <p>Shared lossless wordmark: 7.4 KB. Favicon: 5.4 KB.<br>Wordmark-only header; the S icon represents the app in Windows.</p>
  </article>
  <article class="dark">
    <h1>Dark · sand ink</h1>
    <div class="identity"><img src="/scribly-icon-dark.webp" alt="Dark Scribly S icon"><span class="word" role="img" aria-label="Scribly"></span></div>
    <div class="header"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="1"/><path d="M9 4v16"/></svg><span class="divider"></span><span class="word" role="img" aria-label="Scribly at actual header size"></span></div>
    <div class="sizes"><figure><img src="/scribly-icon-dark.png" width="16" height="16" alt="16 pixel dark S icon"><figcaption>16px</figcaption></figure><figure><img src="/scribly-icon-dark.png" width="20" height="20" alt="20 pixel dark S icon"><figcaption>20px</figcaption></figure><figure><img src="/scribly-icon-dark.png" width="32" height="32" alt="32 pixel dark S icon"><figcaption>32px</figcaption></figure><figure><img src="/scribly-icon-dark.png" width="48" height="48" alt="48 pixel dark S icon"><figcaption>48px</figcaption></figure></div>
    <p>The same wordmark mask uses the theme's sand accent.<br>Native icons switch live with Light, Dark, and System mode.</p>
  </article>
</main>
</html>
